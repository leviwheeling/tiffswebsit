services:
  - type: web
    name: dfd-site
    env: python
    plan: free
    region: oregon

    buildCommand: |
      # 1. Clear npm cache and install Node dependencies
      npm cache clean --force
      npm ci
      npm run build

      # 2. Install Python dependencies
      pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    autoDeploy: true
